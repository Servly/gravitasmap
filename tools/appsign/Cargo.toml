[package]
name = "appsign"
version = "0.1.0"
edition = "2021"
description = "Signs GRAVITAS app update files (ed25519). Dev tool, never shipped. The private key stays on this computer."

[dependencies]
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"

[profile.release]
opt-level = "s"
