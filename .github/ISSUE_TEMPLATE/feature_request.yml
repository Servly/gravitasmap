name: Feature request
description: An idea for GRAVITAS
labels: ["enhancement"]
body:
  - type: textarea
    id: need
    attributes:
      label: What would you like to do that you cannot do now?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could it work?
  - type: dropdown
    id: where
    attributes:
      label: Where would it live?
      options:
        - Map or orrery
        - Combat
        - Thargoid
        - Debrief
        - PVP
        - Collisions, Sonification or Lenses
        - Phone or tablet
        - Other
  - type: markdown
    attributes:
      value: GRAVITAS uses only the game's own files and public data. Ideas that need reading the game's memory or changing the game cannot be accepted.
